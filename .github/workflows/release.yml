name: CI/CD — Build, Sign, Deploy Pages & Publish Versioned Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'ci-release-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1 : Web Build, Validation, GitHub Pages & Web Release Artifact
  # ============================================================================
  build-web:
    name: Build & Validate Web (React + Cairo PDF + ObjectBox)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Static analysis & TypeScript check
        run: npm run lint

      - name: Build production Web bundle (with relative base './' for /CCTV-Autorisation/)
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Package web-build.zip for GitHub Release
        run: |
          cd dist
          zip -r ../web-build.zip .
          cd ..
          ls -lh web-build.zip

      - name: Compute semantic version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
            TAG="v1.0.${COUNT}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${TAG}"

      - name: Upload web-build.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: web-build.zip

      - name: Publish ./dist to gh-pages branch (for branch-based GitHub Pages)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ============================================================================
  # JOB 2 : Deploy Web to GitHub Pages
  # ============================================================================
  deploy-pages:
    name: Deploy Live Web to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # JOB 3 : Build & Sign Flutter Android Release (APK + AAB) per AGENTS.md
  # ============================================================================
  build-android:
    name: Build & Sign Android Release (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify native Android host
        run: test -f android/app/build.gradle.kts

      - name: Reconstruct temporary Android Keystore from GitHub Secrets (AGENTS.md §14)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/keystores/release.jks
            cat > android/key.properties << EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystores/release.jks
          EOF
            echo "Signing keystore configured from GitHub Secrets."
          else
            echo "::warning::No KEYSTORE_BASE64 secret found; release build will fall back to the debug keystore."
          fi

      - name: Install dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get

      - name: Regenerate ObjectBox code (if needed)
        run: |
          if [ ! -f lib/objectbox.g.dart ] || [ lib/models/objectbox_entities.dart -nt lib/objectbox.g.dart ]; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "ObjectBox generated code is up to date."
          fi

      - name: Static analysis
        run: flutter analyze lib

      - name: Build Android Release APK & AppBundle (AAB)
        run: |
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab ../app-release.aab
          ls -lh ../app-release.apk ../app-release.aab

      - name: Verify APK signing
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs ../app-release.apk | head -5 || true

      - name: Remove temporary sensitive keystore files (AGENTS.md §14)
        if: always()
        run: |
          rm -f android/app/keystores/release.jks android/key.properties

      - name: Upload Android Release Artifacts (APK + AAB)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundles
          path: |
            app-release.apk
            app-release.aab

  # ============================================================================
  # JOB 4 : Publish Versioned GitHub Release (v1.0.x) with Web + APK + AAB
  # ============================================================================
  publish-release:
    name: Publish Versioned GitHub Release
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Versioned GitHub Release (${{ needs.build-web.outputs.release_tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-web.outputs.release_tag }}
          name: "Release ${{ needs.build-web.outputs.release_tag }} — DRAG Wilaya ObjectBox & Cairo PDF"
          generate_release_notes: true
          files: |
            release-assets/web-build.zip
            release-assets/app-release.apk
            release-assets/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
